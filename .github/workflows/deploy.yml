name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'production-deploy' || format('test-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Test and build frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run
          npm run build
      - name: Test API
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy container release
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu

            SOURCE_DIR=/srv/apps/designops/source

            case "$DEPLOY_SHA" in
              ''|*[!0-9a-f]*) echo "Invalid deployment SHA"; exit 1 ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Deployment SHA must contain 40 hexadecimal characters"
              exit 1
            fi
            if [ ! -d "$SOURCE_DIR/.git" ]; then
              echo "Missing bootstrapped deployment checkout: $SOURCE_DIR"
              exit 1
            fi

            git -C "$SOURCE_DIR" fetch --prune origin main
            git -C "$SOURCE_DIR" checkout --detach "$DEPLOY_SHA"
            test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$DEPLOY_SHA"

            exec bash "$SOURCE_DIR/ops/deploy-vps.sh" "$DEPLOY_SHA"

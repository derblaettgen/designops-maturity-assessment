server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects must stay relative: the public host and port belong to the
    # reverse proxy in front of this container.
    absolute_redirect off;

    location = /survey {
        return 301 /survey/;
    }

    location /survey/ {
        index index.html;
        try_files $uri $uri/ /survey/index.html;
    }

    location / {
        return 404;
    }
}
